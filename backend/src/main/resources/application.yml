spring:
  application:
    name: bidwise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bidwise}
    username: ${SPRING_DATASOURCE_USERNAME:bidwise}
    password: ${SPRING_DATASOURCE_PASSWORD:bidwise_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Real-time bidding (P2): anti-snipe extends a late bid's auction; the close sweep
# ends auctions past their (possibly extended) end time.
auction:
  anti-snipe:
    window-seconds: ${AUCTION_ANTI_SNIPE_WINDOW_SECONDS:60}
    extension-seconds: ${AUCTION_ANTI_SNIPE_EXTENSION_SECONDS:120}
  close:
    enabled: ${AUCTION_CLOSE_ENABLED:true}
    poll-ms: ${AUCTION_CLOSE_POLL_MS:15000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
