spring:
  datasource:
    url: jdbc:h2:mem:bidwise;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-that-is-definitely-long-enough-32b
  expiration-ms: 3600000

# Disable the scheduled auction-close sweep in tests so the H2 suites never reach
# Redis. The bidding integration test (with a Testcontainers Redis) drives close
# by calling AuctionCloseService directly.
auction:
  close:
    enabled: false
  anti-snipe:
    window-seconds: 60
    extension-seconds: 120
